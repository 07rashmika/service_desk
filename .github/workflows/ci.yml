name: CI

on:
  push:
    branches: [main, developing]
  pull_request:
    branches: [main, developing]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Code style, static analysis & tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: mbstring, pdo_sqlite, gd, intl
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer packages
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}

      - name: Install PHP packages
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install JavaScript packages
        run: npm ci

      - name: Build the CSS and JavaScript
        run: npm run build

      - name: Prepare the environment file
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Check code style (Pint)
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress

      - name: Run the tests
        run: php artisan test

      - name: Check packages for known security issues
        run: |
          composer audit
          npm audit --omit=dev --audit-level=high
